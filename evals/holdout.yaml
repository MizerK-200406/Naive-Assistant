  trang: "14"
  tu_khoa_bat_buoc: ["97 Man Thiện", "Tổ Quản lý Ký túc xá"]

- id: A12
  nhom: A
  cau_hoi: "Muốn làm lại thẻ sinh viên bị mất hoặc đăng ký cấp bảng điểm cá nhân trong thời gian đang học thì liên hệ đơn vị nào?"
  dap_an_chuan: "Làm lại thẻ sinh viên tại Phòng Công tác Sinh viên; xin cấp bản sao bảng điểm cá nhân tại Phòng Giáo vụ."
  nguon: "Chức năng các đơn vị & Quy định đào tạo, Điều 31 khoản 2, 3"
  trang: "13, 83"
  tu_khoa_bat_buoc: ["Phòng Công tác Sinh viên", "Phòng Giáo vụ"]

- id: A13
  nhom: A
  cau_hoi: "Thang điểm chính thức dùng để tính điểm trung bình chung tích lũy (GPA) và xếp hạng học lực sinh viên PTIT là thang điểm mấy?"
  dap_an_chuan: "Thang điểm 4 (A+, A, B+, B, C+, C, D+, D, F) là thang điểm chính thức dùng để tính ĐTBCTL và xếp hạng học lực."
  nguon: "Quy định đào tạo đại học theo tín chỉ (QĐ 838/QĐ-HV), Điều 25 khoản 1b, Điều 28 khoản 1"
  trang: "78-79, 81"
  tu_khoa_bat_buoc: ["Thang điểm 4", "điểm chữ"]

- id: A14
  nhom: A
  cau_hoi: "Mức thưởng bằng tiền mặt cho cá nhân sinh viên đạt Giải Nhất / Huy chương Vàng kỳ thi Olympic cấp Quốc gia do Bộ GD&ĐT tổ chức là bao nhiêu?"
  dap_an_chuan: "Mức chi khen thưởng cá nhân đạt Giải Nhất cấp Quốc gia là 7.000.000 đồng."
  nguon: "Quy định Quỹ học bổng và hỗ trợ người học (QĐ 542/QĐ-HV), Phụ lục I - Mục II.2a"
  trang: "159"
  tu_khoa_bat_buoc: ["7.000.000", "cá nhân"]

- id: B09
  nhom: B
  cau_hoi: "Sinh viên muốn đăng ký học song ngành (chương trình thứ hai) cần nộp đơn thời gian nào, ĐTBCTL tối thiểu bao nhiêu và thời hạn nộp đơn muộn nhất trước tốt nghiệp?"
  dap_an_chuan: "Nộp đơn trước 30/4 và tháng 11 hàng năm tại Phòng Giáo vụ khi xếp trình độ năm hai. Yêu cầu ĐTBCTL loại Khá (>= 2.50) hoặc Trung bình (>= 2.00) nếu đạt điểm trúng tuyển ngành 2. Đăng ký muộn nhất 02 năm trước thời điểm xét tốt nghiệp chương trình thứ hai."
  nguon: "Quy định đào tạo đại học theo tín chỉ (QĐ 838/QĐ-HV), Điều 17 khoản 2, 5, 6"
  trang: "73"
  tu_khoa_bat_buoc: ["tháng 4 và tháng 11", "02 năm"]

- id: B10
  nhom: B
  cau_hoi: "Sinh viên đạt ĐTBCTL toàn khóa 3.65 (đủ mốc Xuất sắc) nhưng trong khóa học có 9 tín chỉ bị điểm F phải học lại (tổng số TC toàn khóa là 150 TC). Hạng tốt nghiệp thực tế ghi trên bằng là gì?"
  dap_an_chuan: "Tỷ lệ TC bị điểm F học lại = 9 / 150 = 6.0% (> 5%). Do vượt quá 5% tổng số tín chỉ toàn khóa, sinh viên bị hạ 1 mức hạng tốt nghiệp từ Xuất sắc xuống loại GIỎI."
  nguon: "Quy định đào tạo đại học theo tín chỉ (QĐ 838/QĐ-HV), Điều 38 khoản 6a"
  trang: "87"
  tu_khoa_bat_buoc: ["hạ 1 mức", "Loại Giỏi"]

- id: C05
  nhom: C
  cau_hoi: "Một tập thể sinh viên đạt Giải Nhì cuộc thi Olympic chuyên môn học thuật cấp Quốc gia do Bộ GD&ĐT tổ chức thì mức tiền thưởng dành cho tập thể là bao nhiêu?"
  dap_an_chuan: "Mức chi khen thưởng tập thể đạt Giải Nhì cuộc thi Olympic cấp Quốc gia là 7.000.000 đồng."
  nguon: "Quy định Quỹ học bổng và hỗ trợ người học (QĐ 542/QĐ-HV), Phụ lục I - Mục II.2b"
  trang: "159"
  tu_khoa_bat_buoc: ["7.000.000", "tập thể"]

- id: D05
  nhom: D
  cau_hoi: "Sinh viên năm nhất học kỳ 1 có được xin nghỉ học tạm thời vì nhu cầu cá nhân không? Điều kiện nghỉ tạm thời vì nhu cầu cá nhân khác gì so với nghỉ do đi nghĩa vụ quân sự?"
  dap_an_chuan: "Sinh viên HK1 năm nhất KHÔNG được nghỉ vì nhu cầu cá nhân (chỉ áp dụng khi đã học ít nhất 1 học kỳ và ĐTBCTL >= 2.0). Đối với lý do nghĩa vụ quân sự, sinh viên được nghỉ ngay không phụ thuộc số học kỳ hay điểm số."
  nguon: "Quy định đào tạo đại học theo tín chỉ (QĐ 838/QĐ-HV), Điều 15 khoản 2"
  trang: "71"
  tu_khoa_bat_buoc: ["ít nhất một (01) học kỳ", "nghĩa vụ quân sự"]

- id: E06
  nhom: E
  cau_hoi: "Quy trình xin cấp lại mật khẩu tài khoản ngân hàng liên kết thu học phí của sinh viên được hướng dẫn chi tiết như thế nào trong Sổ tay?"
  dap_an_chuan: "Sổ tay không hướng dẫn quy trình tài khoản ngân hàng cá nhân, chỉ hướng dẫn đăng nhập hệ thống UIS (uis.ptithcm.edu.vn) và ứng dụng PTIT S-Link."
  nguon: "Sổ tay sinh viên PTIT (Không có thông tin trong tài liệu)"
  trang: "Không có"
  tu_khoa_bat_buoc: ["Không hướng dẫn", "UIS"]