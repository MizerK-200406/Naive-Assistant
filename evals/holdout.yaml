- id: A10
  nhom: A
  cau_hoi: "Sinh viên mới nhập học hệ đại trà test đầu vào tiếng Anh đạt dưới 225 điểm TOEIC thì phải học khóa học phần bổ trợ nào?"
  dap_an_chuan: "Sinh viên thuộc Nhóm 2, bắt buộc phải học và đạt học phần tiếng Anh bổ trợ Course 0 (4 tín chỉ)."
  nguon: "Quy định đào tạo và kiểm tra chuẩn đầu ra tiếng Anh hệ đại trà (QĐ 734/QĐ-HV & QĐ 629/QĐ-HV), Điều 4 khoản 4b, Điều 5 khoản 2"
  trang: "98-99"
  tu_khoa_bat_buoc: ["Course 0", "4 tín chỉ"]

