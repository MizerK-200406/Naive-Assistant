  dap_an_chuan: "KTX đặt tại số 97 Man Thiện, Phường Tăng Nhơn Phú, TP. Thủ Đức; do Tổ Quản lý Ký túc xá thuộc Phòng Tổ chức – Hành chính – Quản trị trực tiếp quản lý."
